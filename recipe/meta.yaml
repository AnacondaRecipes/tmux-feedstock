{% set version = "3.6" %}
{% set sha256 = "136db80cfbfba617a103401f52874e7c64927986b65b1b700350b6058ad69607" %}

package:
  name: tmux
  version: {{ version }}

source:
  url: https://github.com/tmux/tmux/releases/download/{{ version }}/tmux-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - gnuconfig  # [unix]
    - {{ compiler('c') }}
    - autoconf
    - automake
    - libtool
    - m4
    - make
    - pkg-config

  host:
    - libevent
    - libutf8proc  # [osx]
    - ncurses

  run:
    - libevent
    - libutf8proc  # [osx]
    - ncurses

test:
  commands:
    # Verify command existence.
    - ls $PREFIX/bin/tmux
    # OPTIONALLY: Verify it executes. This must be done where no server is running, otherwise the test is likely to hang.
    - $(tmux info || true) 2> >(grep "no server running")   # [not osx] tmux is running as part of the osx build system, so this test does not work there.

about:
  home: https://tmux.github.io/
  license: ISC
  license_family: OTHER
  license_file: COPYING
  summary: A terminal multiplexer.
  dev_url: https://github.com/tmux/tmux
  doc_url: https://github.com/tmux/tmux

extra:
  recipe-maintainers:
    - jakirkham
    - djsutherland
